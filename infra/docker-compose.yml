version: "3.8"

networks:
  routine_network:
    driver: bridge

services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: qdrant_local
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - routine_network
    restart: unless-stopped

  mlflow:
    image: python:3.11-slim
    container_name: mlflow_local
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - routine_network
    command: >
      bash -c "pip install mlflow && mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000"
    restart: unless-stopped

volumes:
  qdrant_storage:
  mlflow_data:
