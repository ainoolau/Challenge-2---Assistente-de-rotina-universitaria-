services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: routine_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP REST API & Web Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - routine_network
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: routine_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - routine_network
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:////mlflow/mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  qdrant_storage:
    name: routine_qdrant_storage
  mlflow_data:
    name: routine_mlflow_data

networks:
  routine_network:
    name: routine_network
    driver: bridge