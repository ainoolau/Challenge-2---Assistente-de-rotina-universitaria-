[project]
name = "assistente-rotina-academica"
version = "0.1.0"
description = "Assistente de rotina e gestão de tempo para universitários em multijornada"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "streamlit>=1.32.0",
    "mlflow>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # Erros pycodestyle
    "W",   # Avisos pycodestyle
    "F",   # Pyflakes (erros lógicos, variáveis não usadas)
    "I",   # isort (ordenação automática de imports)
    "B",   # flake8-bugbear (armadilhas comuns)
]
ignore = [
    "B008", # Permite Depends(...) padrão em parâmetros do FastAPI
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]