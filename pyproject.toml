[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assistente-rotina-academica"
version = "0.1.0"
description = "Assistente de rotina e gestao de tempo para universitarios em multijornada"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "streamlit>=1.32.0",
    "mlflow>=2.11.0",
    "qdrant-client>=1.8.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "accelerate>=0.28.0",
    "datasets>=2.18.0",
    "langchain-text-splitters>=0.0.1",
    "pytesseract>=0.3.10",
    "Pillow>=10.2.0",
    "openai-whisper>=20231117",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]