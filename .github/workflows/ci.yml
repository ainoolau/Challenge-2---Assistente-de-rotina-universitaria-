name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-types:
    name: Lint & Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar ferramentas de qualidade
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Executar Ruff (Linter e Formatação)
        run: |
          ruff check .
          ruff format --check .

      - name: Checagem Estática de Tipos (MyPy)
        run: |
          mypy src --ignore-missing-imports

  guardrails:
    name: Bloqueio de Binários e LGPD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Verificar se há pesos de modelos, mídias ou arquivos pesados
        run: |
          python - << 'EOF'
          import sys
          from pathlib import Path

          EXTENSOES_BLOQUEADAS = (
              ".bin", ".pt", ".pth", ".gguf", ".safetensors", ".onnx", 
              ".tar.gz", ".zip", ".wav", ".mp3", ".m4a", ".pdf"
          )
          limite_mb = 2.0
          violacoes = []

          for path in Path(".").rglob("*"):
              if ".git" in path.parts or ".venv" in path.parts:
                  continue
              if path.is_file():
                  nome = path.name.lower()
                  tamanho_mb = path.stat().st_size / (1024 * 1024)

                  if any(nome.endswith(ext) for ext in EXTENSOES_BLOQUEADAS):
                      violacoes.append(f"Extensão bloqueada (modelo/mídia/LGPD): {path}")
                  elif tamanho_mb > limite_mb:
                      violacoes.append(f"Arquivo excede limite seguro ({limite_mb}MB): {path} ({tamanho_mb:.2f}MB)")

          if violacoes:
              print("❌ Falha na validação de guardrails:")
              for v in violacoes:
                  print(f"  - {v}")
              sys.exit(1)
          print("✅ Repositório limpo: nenhum binário ou dado bruto detectado.")
          EOF

  unit-tests:
    name: Testes Automatizados (Leves)
    runs-on: ubuntu-latest
    needs: [lint-and-types, guardrails]
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências leves de teste
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock pytest-asyncio

      - name: Executar Testes Unitários de Smoke
        run: |
          pytest tests/test_smoke.py