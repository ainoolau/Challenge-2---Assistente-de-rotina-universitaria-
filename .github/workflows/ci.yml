name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-types:
    name: Lint & Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar ferramentas de qualidade
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Executar Ruff (Linter e Formatação)
        run: |
          ruff check .
          ruff format --check .

      - name: Checagem Estática de Tipos (MyPy)
        run: |
          mypy src --ignore-missing-imports --no-warn-return-any

  guardrails:
    name: Bloqueio de Binários e LGPD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Verificar se há pesos de modelos, mídias ou arquivos pesados
        run: |
          python - << 'EOF'
          import sys
          from pathlib import Path

          EXTENSOES_PESOS_MODELOS = (
              ".bin", ".pt", ".pth", ".gguf", ".safetensors", ".onnx"
          )
          EXTENSOES_MIDIA_LGPD = (
              ".tar.gz", ".zip", ".wav", ".mp3", ".m4a", ".pdf"
          )
          limite_mb = 10.0
          violacoes = []

          for path in Path(".").rglob("*"):
              partes = [p.lower() for p in path.parts]
              if ".git" in partes or ".venv" in partes or "node_modules" in partes:
                  continue
              
              if path.is_file():
                  nome = path.name.lower()
                  tamanho_mb = path.stat().st_size / (1024 * 1024)
                  caminho_posix = path.as_posix().lower()

                  # 1. Pesos de modelos são estritamente proibidos em qualquer lugar
                  if any(nome.endswith(ext) for ext in EXTENSOES_PESOS_MODELOS):
                      violacoes.append(f"Peso de modelo detectado: {path}")
                      continue

                  # 2. Arquivos de mídia/PDF em data/samples são amostras controladas permitidas
                  if caminho_posix.startswith("data/samples/"):
                      continue

                  # 3. Fora de data/samples, extensões de mídia/LGPD são barradas
                  if any(nome.endswith(ext) for ext in EXTENSOES_MIDIA_LGPD):
                      violacoes.append(f"Extensão bloqueada fora de data/samples (LGPD/Mídia): {path}")
                  elif tamanho_mb > limite_mb:
                      violacoes.append(f"Arquivo excede limite seguro ({limite_mb}MB): {path} ({tamanho_mb:.2f}MB)")

          if violacoes:
              print(" Falha na validação de guardrails:")
              for v in violacoes:
                  print(f"  - {v}")
              sys.exit(1)

          print(" Repositório limpo: guardrails aprovados.")
          EOF

  unit-tests:
    name: Testes Automatizados (Leves)
    runs-on: ubuntu-latest
    needs: [lint-and-types, guardrails]
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências leves de teste
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock pytest-asyncio jsonschema

      - name: Executar Testes Unitários de Smoke
        run: |
          pytest tests/test_smoke.py

      - name: Validar Golden Set e Contrato do Benchmark (TASK-S3-01)
        run: |
          pytest tests/test_benchmark_golden_set.py -v