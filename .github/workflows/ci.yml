name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-types:
    name: Lint & Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar ferramentas de qualidade
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Executar Ruff (Linter e Formatação)
        run: |
          ruff check .
          ruff format --check .

      - name: Checagem Estática de Tipos (MyPy)
        run: |
          mypy src --ignore-missing-imports

  guardrails:
    name: Bloqueio de Binários e Modelos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Verificar se há pesos de modelos ou arquivos grandes
        run: |
          python - << 'EOF'
          import sys
          from pathlib import Path

          EXTENSOES_BLOQUEADAS = {".bin", ".pt", ".pth", ".gguf", ".safetensors", ".onnx", ".tar.gz", ".zip"}
          limite_mb = 10
          violacoes = []

          for path in Path(".").rglob("*"):
              if ".git" in path.parts or ".venv" in path.parts:
                  continue
              if path.is_file():
                  if path.suffix.lower() in EXTENSOES_BLOQUEADAS:
                      violacoes.append(f"Extensão proibida detectada: {path}")
                  elif path.stat().st_size > limite_mb * 1024 * 1024:
                      violacoes.append(f"Arquivo excede limite ({limite_mb}MB): {path} ({path.stat().st_size / (1024*1024):.2f}MB)")

          if violacoes:
              print("❌ Falha na validação de arquivos binários:")
              for v in violacoes:
                  print(f"  - {v}")
              sys.exit(1)
          print("✅ Nenhum arquivo proibido detectado.")
          EOF

  unit-tests:
    name: Testes Automatizados
    runs-on: ubuntu-latest
    needs: [lint-and-types, guardrails]
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências do projeto
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pytest-mock pytest-asyncio

      - name: Executar Testes Unitários
        run: |
          pytest tests/ -k "not test_qdrant_smoke"
